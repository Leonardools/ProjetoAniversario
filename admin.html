<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin • THE NEXT CHAPTER</title>
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/admin.js"></script>
</head>
<body>
  <main class="shell">
    <header><div class="badge">THE NEXT CHAPTER / ADMIN</div><h1>Painel de recados<span>.</span></h1><p>Gerencie as mensagens da sua celebração.</p></header>
    <section id="loginSection" class="panel">
      <h2>Entrar como administrador</h2>
      <form id="loginForm">
        <label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required>
        <label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar no painel →</button>
      </form>
      <p id="loginStatus" role="status"></p>
    </section>
    <section id="dashboard" class="panel" hidden>
      <div class="toolbar"><div><h2>Mensagens recebidas</h2><p><strong id="messageCount">0</strong> recados</p></div><button id="logoutButton" type="button" class="secondary">Sair</button></div>
      <p id="adminStatus" role="status"></p><div id="adminMessages" class="cards"></div>
    </section>
    <footer><a href="index.html">← Voltar ao convite</a></footer>
  </main>
</body>
</html>
